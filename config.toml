[interface]
visible = true

[camera]
device = 0
width = 600
height = 480
fps = 30

[tracking]
process_every_n_frames = 2
detection_confidence = 0.65
tracking_confidence = 0.65
control_hand = "right"

[volume]
minimum_distance = 25
maximum_distance = 50
smoothing = 0.18
update_interval = 0.15
minimum_change = 0.1

[activation]
enabled = true
hold_seconds = 0.8
cooldown = 1.5
start_active = false
beep = true

[gestures]
pinch = "volume"
fist = ""
thumbs_up = "play_pause"
peace = "next_track"
three_fingers = "previous_track"
thumb_pinky = "mute"

[gesture_detection]
stability_seconds = 0.35
loss_tolerance_seconds = 0.12
release_seconds = 0.25
default_cooldown = 1.0

[gesture_cooldowns]
play_pause = 1.0
next_track = 1.0
previous_track = 1.0
mute = 1.0

[feedback]
beep = true
display_seconds = 1.5

[performance]
camera_buffer = 1
config_reload_seconds = 1.0

[privacy]
blur_face = true
blur_strength = 59
blur_padding = 0.05
detect_every_n_frames = 2
