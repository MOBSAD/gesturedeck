[project]
name = "gesturedeck"
version = "0.2.0"
description = "Motor configurável de gestos para mídia e volume no Linux"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "mediapipe==0.10.21",
    "opencv-python>=4.10,<5",
]

[project.scripts]
gesturedeck = "main:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "config", "gestures", "actions"]
